<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//soundcloud.com">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Theme colors -->
    <meta name="theme-color" content="#0a0a0b">
    <meta name="msapplication-TileColor" content="#0a0a0b">
    
    <!-- Default meta tags (will be overridden by SEO component) -->
    <title>Corey Smaller - Personal Website</title>
    <meta name="description" content="Personal website of Corey Smaller featuring blog posts, music portfolio, and creative content.">
    <meta name="keywords" content="Corey Smaller, blog, music, portfolio, personal website">
    <meta name="author" content="Corey Smaller">
    
    <!-- Open Graph defaults -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Corey Smaller">
    
    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
